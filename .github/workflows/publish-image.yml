name: Publish TRMNL Terminus Image

on:
  push:
    branches:
      - dev
      - main
    paths:
      - config.yaml
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve add-on version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F': ' '/^version:/{print $2; exit}' config.yaml | tr -d '"')"
          if [[ -z "${version}" ]]; then
            echo "Unable to read version from config.yaml" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hassio-trmnl-terminus:${{ steps.version.outputs.value }}
          labels: |
            io.hass.version=${{ steps.version.outputs.value }}
            io.hass.type=addon
            io.hass.arch=aarch64|amd64
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
